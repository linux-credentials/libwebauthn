[package]
name = "libwebauthn-pxp"
description = "FIDO Proximity Exchange Protocol (PXP, formerly CTAP hybrid / caBLE) client for Linux, written in Rust"
version = "0.10.0"
authors = [
    "Alfie Fresta <afresta@noentropy.org>",
    "Martin Sirringhaus <martin.sirringhaus@suse.com>",
    "Isaiah Inuwa <isaiah.inuwa@gmail.com>",
]
edition = "2021"
rust-version = "1.88"
license = "LGPL-2.1-or-later"
license-file = "../COPYING"
readme = "../README.md"
homepage = "https://github.com/linux-credentials"
repository = "https://github.com/linux-credentials/libwebauthn"

[lib]
name = "libwebauthn_pxp"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.36"
base64-url = "3.0.0"
bluer = { version = "0.17", default-features = false, features = ["l2cap"] }
btleplug = "0.11.7"
aes = "0.8.2"
futures = "0.3.5"
hex = "0.4.3"
hkdf = "0.12"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh", "arithmetic", "serde"] }
rand = "0.8.5"
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
serde = "1.0.110"
serde_bytes = "0.11.5"
serde_cbor_2 = "0.13"
serde-indexed = "0.2.0"
serde_repr = "0.1.6"
sha2 = "0.10.2"
snow = { version = "0.10", features = ["use-p256"] }
thiserror = "2.0.12"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = [
    "rustls-tls-native-roots",
] }
tracing = "0.1.29"
tungstenite = { version = "0.26.2" }
url = "2.5"
uuid = { version = "1.5.0", features = ["serde", "v4"] }

[dev-dependencies]
test-log = { version = "0.2" }
