[package]
name = "libwebauthn-varlink-server"
description = "FIDO2 (WebAuthn) varlink server for Linux written in Rust"
version = "0.1.0"
authors = ["Andreas Bergmeier <abergmeier@gmx.net>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "webauthd-link"
path = "src/main.rs"

[dependencies]
async-stream = "0.3.6"
futures-util.workspace = true
libwebauthn.workspace = true
libwebauthn-varlink-types.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber.workspace = true
uuid = "1.24.0"
zlink.workspace = true
