[workspace]
resolver = "2"
members = [
    "libwebauthn",
    "libwebauthn-tests",
    "libwebauthn-varlink-client",
    "libwebauthn-varlink-server",
    "libwebauthn-varlink-types",
]

# Shared by the varlink crates. libwebauthn and libwebauthn-tests keep their own
# metadata and dependency versions.
[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "LGPL-2.1-or-later"
readme = "README.md"
homepage = "https://github.com/linux-credentials"
repository = "https://github.com/linux-credentials/libwebauthn"

[workspace.dependencies]
futures-util = "0.3.33"
libwebauthn = { path = "libwebauthn" }
libwebauthn-varlink-types = { path = "libwebauthn-varlink-types" }
serde = "1.0.229"
tokio = "1.53.1"
tracing-subscriber = { version = "0.3.3", features = ["env-filter"] }
zlink = "0.7.1"

# The trussed ecosystem is currently a bit messy, so we have to do some patching of the versions
[patch.crates-io]
trussed = { git = "https://github.com/trussed-dev/trussed.git", rev = "024e0eca5fb7dbd2457831f7c7bffe4341e08775" }
trussed-staging = { git = "https://github.com/trussed-dev/trussed-staging.git", rev = "7922d67e9637a87e5625aaff9e5111f0d4ec0346" }
